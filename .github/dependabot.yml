version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    ignore:
      # Code Foundry runtime pins are sync-managed (runtime_ref in
      # code-foundry.yml). Dependabot must never bump them; a stale
      # github-actions group PR branched before a sync can resurrect
      # legacy caller files when merged.
      - dependency-name: '0xPlayerOne/code-foundry*'
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns: ['*']
    ignore:
      # TypeScript 6+ breaks this toolchain (verified: TS 6.0.3 errors
      # on deprecated `baseUrl` in tsconfig, TS 7 drops it entirely).
      # Revisit when the TS/eslint toolchain supports TS 6/7.
      - dependency-name: 'typescript'
        versions: ['>=6.0.0']
      # Held with TypeScript 5.9 above.
      - dependency-name: '@types/node'
        versions: ['>=23']
  - package-ecosystem: pip
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ['*']
