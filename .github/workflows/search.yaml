name: Doc Search Index

permissions:
  contents: read

on:
  # Allow manual trigger for reindexing
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/search.yaml'
      - 'docs/**'
      - 'src/contracts/**/*.sol'
    branches:
      - main
      - staging

jobs:
  search:
    name: Index Documentation
    runs-on: ubuntu-latest
    steps:
