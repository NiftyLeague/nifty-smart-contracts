        uses: actions/checkout@v7

      - name: Generate API reference from natspec
        run: |
          echo "Natspec extraction placeholder — add solidity-docgen or similar here."
          echo "NiftyLeague/nifty-smart-contracts — Solidity + Hardhat + Bun"

      - name: Index placeholder
        run: |
          echo "Configure Algolia docsearch or other indexer under docs/ when docs exist."
          echo "Algolia env vars: ALGOLIA_APP_ID, ALGOLIA_API_KEY"
