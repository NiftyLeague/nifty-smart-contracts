name: Code Foundry Draft PR

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'docs/*'
      - 'style/*'
      - 'test/*'

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-pr:
    name: Draft PR
    if: vars.CI_BILLING_PAUSED != 'true'
    uses: 0xPlayerOne/code-foundry/.github/workflows/draft-pr.yml@801cb23c8000de9adf2db8744f9fab5a94af155f
    with:
      runner: ubuntu-slim
      base: main
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
