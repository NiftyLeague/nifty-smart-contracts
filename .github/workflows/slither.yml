name: Slither Analysis

on:
  push:
    branches: [main, staging]

concurrency:
  group: slither-${{ github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-slither-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-slither-bun-

      - name: Cache Slither packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-slither-python-v1
          restore-keys: |
            ${{ runner.os }}-slither-python-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the contracts
        run: bunx hardhat compile

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        id: slither
        with:
          ignore-compile: true
          node-version: 20
          sarif: results.sarif
          fail-on: high

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
